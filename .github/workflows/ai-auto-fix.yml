name: AI Auto Fix Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        id: check
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          echo "Android project files:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' | sort | head -200

      - name: Build Android APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew missing"
            echo "This repository needs a Gradle Wrapper."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            **/build/reports/
            **/build/outputs/
          if-no-files-found: warn

      - name: Report result
        if: always()
        shell: bash
        run: |
          echo "Build result: ${{ steps.build.outcome }}"
          echo "Check the previous steps for the exact error."
